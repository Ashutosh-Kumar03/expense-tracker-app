<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Expense Tracker</h1>

    <div class="balance-card">
      <h2>Balance</h2>
      <p id="balance">₹0</p>
    </div>

    <div class="summary">
      <div class="income-box">
        <h3>Income</h3>
        <p id="income">₹0</p>
      </div>
      <div class="expense-box">
        <h3>Expense</h3>
        <p id="expense">₹0</p>
      </div>
    </div>

    <div class="form-section">
      <input type="text" id="title" placeholder="Transaction title" />
      <input type="number" id="amount" placeholder="Amount" />

      <select id="type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>

      <select id="category">
        <option>Food</option>
        <option>Travel</option>
        <option>College</option>
        <option>Shopping</option>
        <option>Salary</option>
        <option>Other</option>
      </select>

      <button onclick="addTransaction()">Add Transaction</button>
    </div>

    <h2>Transactions</h2>
    <ul id="transactionList"></ul>
  </div>

    <div class="controls">
  <input type="text" id="searchInput" placeholder="Search..." onkeyup="renderTransactions()" />

  <div class="filters">
    <button onclick="setFilter('all')">All</button>
    <button onclick="setFilter('income')">Income</button>
    <button onclick="setFilter('expense')">Expense</button>
  </div>

  <button onclick="clearAll()" class="clear-btn">Clear All</button>
</div>

  <script src="script.js"></script>
</body>
</html>
